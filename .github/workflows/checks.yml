name: Checks

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read
  pull-requests: read

jobs:
  # Server first, GitHub when busy: our server runs this for free when it has a free slot; otherwise GitHub does,
  # straight away, so a check never waits in a queue (Command Centre /api/checks/capacity, 2026-10-15).
  where:
    name: Pick a machine
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
    steps:
      - id: pick
        run: |
          if curl -fsS -m 10 https://command.deployenjoy.com/api/checks/capacity | grep -q '"free":true'; then
            echo 'runner=["self-hosted","cortana"]' >> "$GITHUB_OUTPUT"; echo "Our server has a free slot"
          else
            echo 'runner="ubuntu-latest"' >> "$GITHUB_OUTPUT"; echo "Our server is busy: running on GitHub"
          fi
  secret-scan:
    name: Secret scan
    needs: where
    runs-on: ${{ fromJSON(needs.where.outputs.runner) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  web:
    name: Node (web app)
    needs: where
    runs-on: ${{ fromJSON(needs.where.outputs.runner) }}
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm test --if-present
      - run: npm run build --if-present
